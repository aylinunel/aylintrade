# Default experiment: every strategy on every market.
#
# Add a market by adding an entry under `markets`; add a strategy by registering it in
# `src/quantbt/strategies/` and listing it under `strategies` with its parameters.
# See docs/extending.md.

data_dir: data
results_dir: results/latest

markets:
  SPY:
    label: S&P 500 ETF (SPY)
    group: Equity ETF
    periods_per_year: 252
    cost_per_side: 0.0005        # 5 bp: spread + commission + slippage
    pair_with: DIA
    data:
      1d: { source: sp500_data, symbol: SPY }

  DIA:                           # only used as SPY's pair-trading partner
    label: Dow Jones ETF (DIA)
    group: Equity ETF
    periods_per_year: 252
    cost_per_side: 0.0005
    trade: false
    data:
      1d: { source: sp500_data, symbol: DIA }

  BTC:
    label: Bitcoin (BTC/USDT)
    group: Crypto
    periods_per_year: 365
    cost_per_side: 0.0010
    pair_with: ETH
    data:
      1d: { source: binance_static_klines, symbol: BTCUSDT }
      1h: { source: binance_static_klines, symbol: BTCUSDT, start: "2022-01-01" }

  ETH:
    label: Ethereum (ETH/USDT)
    group: Crypto
    periods_per_year: 365
    cost_per_side: 0.0010
    pair_with: BTC
    data:
      1d: { source: binance_static_klines, symbol: ETHUSDT }
      1h: { source: binance_static_klines, symbol: ETHUSDT, start: "2022-01-01" }

  ES:
    label: S&P 500 E-mini futures (ES)
    group: Futures
    periods_per_year: 252
    cost_per_side: 0.0003
    pair_with: NQ
    data:
      1d: { source: cme_futures_ohlc, symbol: ES }
      1h: { source: cme_futures_ohlc, symbol: ES }

  NQ:                            # only used as ES's pair-trading partner
    label: Nasdaq-100 E-mini futures (NQ)
    group: Futures
    periods_per_year: 252
    cost_per_side: 0.0003
    trade: false
    data:
      1d: { source: cme_futures_ohlc, symbol: NQ }

  GC:
    label: Gold futures (GC)
    group: Futures
    periods_per_year: 252
    cost_per_side: 0.0003
    data:
      1d: { source: cme_futures_ohlc, symbol: GC }

  CL:
    label: Crude oil futures (CL)
    group: Futures
    periods_per_year: 252
    cost_per_side: 0.0005
    data:
      1d: { source: cme_futures_ohlc, symbol: CL }

# Strategy id -> parameters. Defaults match the original je-suis-tm/quant-trading scripts,
# with price-unit thresholds rescaled to percentages (see docs/methodology.md).
strategies:
  buy_and_hold: {}
  macd: { fast: 10, slow: 21 }
  parabolic_sar: { af_start: 0.02, af_step: 0.02, af_max: 0.2 }
  heikin_ashi: { max_units: 3 }
  bollinger_w: { window: 20, num_std: 2.0, lookback: 75, tolerance: 0.01 }
  rsi_head_shoulders: { rsi_period: 14, lookback: 25, tolerance: 0.01, exit_rsi_rise: 4, max_hold: 5 }
  shooting_star: { lower_wick: 0.2, body_size: 0.5, stop: 0.05, max_hold: 7 }
  dual_thrust: { lookback: 5, k: 0.5 }
  london_breakout: { range_hour: 7, entry_hour: 8, close_hour: 17, max_slippage: 0.0075 }
  pair_trading: { window: 250, z_entry: 1.0 }

# Extra checks run by `quantbt robustness`.
robustness:
  - strategy: macd
    markets: [SPY, BTC, ETH]
    param_sets:
      - { fast: 5, slow: 20 }
      - { fast: 10, slow: 21 }
      - { fast: 12, slow: 26 }
      - { fast: 20, slow: 50 }
      - { fast: 50, slow: 200 }
    cost_multipliers: [1, 2, 3]
    subperiods: 2
