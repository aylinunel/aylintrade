# AylinTrade: what to trade, how the algorithm is tuned, and who reviews it.
# Every number here is explained in docs/methodology.md.

data_dir: data
results_dir: results/latest
paper_dir: paper
site_dir: site

# portfolio: false -> tested on its own in the per-market table, never traded.
markets:
  SPY: { label: S&P 500 (SPY), group: US stocks, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: SPY } } }
  QQQ: { label: Nasdaq-100 (QQQ), group: US stocks, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: QQQ } } }
  IWM: { label: Russell 2000 (IWM), group: US stocks, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: IWM } } }
  EFA: { label: Developed ex-US (EFA), group: World stocks, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: EFA } } }
  GLD: { label: Gold (GLD), group: Commodities, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: GLD } } }
  TLT: { label: US Treasuries 20y+ (TLT), group: Bonds, cost_per_side: 0.0005,
         data: { 1d: { source: sp500_data, symbol: TLT } } }
  BTC: { label: Bitcoin (BTC), group: Crypto, cost_per_side: 0.0010,
         data: { 1d: { source: binance_static_klines, symbol: BTCUSDT } } }
  ETH: { label: Ethereum (ETH), group: Crypto, cost_per_side: 0.0010,
         data: { 1d: { source: binance_static_klines, symbol: ETHUSDT } } }

  # Futures: the free dataset holds about one year and stops in April 2026, shorter than
  # the algorithm's two-year minimum (one to warm up, one to test). Kept so they are tested
  # automatically once a longer source is configured.
  ES: { label: S&P 500 E-mini futures (ES), group: Futures, cost_per_side: 0.0003,
        portfolio: false, data: { 1d: { source: cme_futures_ohlc, symbol: ES } } }
  GC: { label: Gold futures (GC), group: Futures, cost_per_side: 0.0003,
        portfolio: false, data: { 1d: { source: cme_futures_ohlc, symbol: GC } } }
  CL: { label: Crude oil futures (CL), group: Futures, cost_per_side: 0.0005,
        portfolio: false, data: { 1d: { source: cme_futures_ohlc, symbol: CL } } }

algorithm:
  horizons: [21, 63, 126, 252]   # trend votes over 1, 3, 6 and 12 months (business days)
  trend_floor: 0.25              # keep 25% of every position whatever the trend
  vol_span: 60                   # days in the volatility estimate
  cov_window: 126                # days in the covariance used for the volatility target
  target_vol: 0.10               # expected yearly volatility of the whole portfolio
  max_gross: 1.0                 # 1.0 = never more than 100% invested (no leverage)
  rebalance_band: 0.03           # skip trades smaller than 3% of the portfolio
  start: 2006-01-01

agents:
  enabled: true                  # needs the ANTHROPIC_API_KEY environment variable
  mode: commentary_shadow        # reports and hypothetical guard outcomes; never changes paper weights
  analyst_model: claude-sonnet-5-5
  manager_model: claude-opus-5-5
  news_search: true              # the news analyst searches the web ($10 per 1,000 searches)
  max_searches: 5
  debate_rounds: 1
  max_cut: 0.5                   # agents may at most halve a position; they never add

macro:
  enabled: true
  fetch_current: true
  source_status: current_context_only
  series: [DGS2, DGS10, T10Y2Y, DFII10, CPIAUCSL, CPILFESL, PAYEMS, UNRATE, ICSA, INDPRO,
           BAMLH0A0HYM2, DTWEXBGS, VIXCLS]

intraday:
  enabled: true
  mode: shadow
  source_status: quarantined
  horizons: [4, 12, 24, 72]
  vol_windows: [24, 168]

paper:
  capital: 100000
