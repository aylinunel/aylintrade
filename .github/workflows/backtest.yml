name: Backtest

# Run the full backtest on fresh data and attach the results to the workflow run.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Config file
        default: configs/default.yaml

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[plot]"
      - run: quantbt fetch -c "${{ inputs.config }}"
      - run: quantbt run -c "${{ inputs.config }}" -j 4 --charts -o results/ci
      - run: quantbt robustness -c "${{ inputs.config }}" -o results/ci
      - run: cat results/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: backtest-results
          path: results/ci
