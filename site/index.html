<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AylinTrade</title>
<meta name="description" content="A multi-market trend portfolio, reviewed daily by a committee of Claude agents and paper traded in public.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3ef; --surface-1: #fcfcfb; --surface-2: #efeee9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6e69;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: #e1e0d9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --warning: #fab219;
  --accent-soft: #e4effc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a9993;
    --grid: #2c2c2a; --axis: #45443f; --border: #2c2c2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good-text: #5fc95f; --accent-soft: #1b2a3d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a9993;
  --grid: #2c2c2a; --axis: #45443f; --border: #2c2c2a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good-text: #5fc95f; --accent-soft: #1b2a3d;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
}
.num, td.n, .tile .value { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
header.top {
  display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between;
  padding: 28px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px;
}
.brand { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--s1); }
.meta { color: var(--text-secondary); font-size: 13px; }
.meta button {
  margin-left: 10px; font: inherit; color: var(--text-secondary); background: none;
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer;
}
h2 { font-size: 18px; font-weight: 600; margin: 40px 0 4px; letter-spacing: -0.005em; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.lede { color: var(--text-secondary); margin: 0 0 16px; max-width: 72ch; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tile .label { color: var(--text-secondary); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 500; margin: 2px 0; letter-spacing: -0.02em; }
.tile .sub { color: var(--text-muted); font-size: 13px; }
.pill {
  display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 9px;
  border-radius: 99px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-1);
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
.pill.ok i { background: var(--good); } .pill.off i { background: var(--warning); } .pill.err i { background: var(--critical); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--text-secondary); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th.n, td.n { text-align: right; }
tr.hl td { background: var(--accent-soft); }
.scroll { overflow-x: auto; }
.votes { display: inline-flex; gap: 3px; vertical-align: middle; }
.votes b { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--s1); display: inline-block; }
.votes b.on { background: var(--s1); }
.bar { height: 8px; border-radius: 4px; background: var(--s1); display: inline-block; vertical-align: middle; margin-right: 8px; }
.bar.cut { background: var(--surface-2); outline: 1px dashed var(--axis); }
.muted { color: var(--text-muted); }
.small { font-size: 13px; }
.pos { color: var(--good-text); } .neg { color: var(--critical); }
details { border-top: 1px solid var(--grid); padding: 10px 0; }
details summary { cursor: pointer; font-weight: 500; }
.report { color: var(--text-secondary); font-size: 14px; margin-top: 8px; }
.report p { margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--text-muted); font: 11px "IBM Plex Mono", monospace; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text-secondary); margin: 4px 0 10px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--axis);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .12);
  white-space: nowrap; display: none; z-index: 2;
}
.tip .d { color: var(--text-muted); margin-bottom: 2px; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; }
.tip .r span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.empty { color: var(--text-muted); padding: 28px; text-align: center; border: 1px dashed var(--axis); border-radius: 8px; }
.note { border-left: 3px solid var(--s1); padding: 4px 12px; color: var(--text-secondary); margin: 12px 0; }
footer { margin-top: 48px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); padding-top: 16px; }
a { color: var(--s1); }
@media (max-width: 640px) { .tile .value { font-size: 24px; } td, th { padding: 6px; } .scroll table { min-width: 720px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Aylin<span>Trade</span></div>
    <div class="meta"><span id="asof">Loading…</span><button id="theme" type="button">Theme</button></div>
  </header>

  <main id="app"><p class="muted">Loading data…</p></main>

  <footer>
    Research and paper trading only, with simulated money. Not financial advice. Past performance,
    in backtests or on paper, does not predict future results.
    <a href="https://github.com/aylinunel/aylintrade">Source on GitHub</a>.
  </footer>
</div>

<script>
"use strict";
const SERIES = ["--s1", "--s2", "--s3", "--s4"];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1, sign = false) => x == null ? "–" : (sign && x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const money = (x) => x == null ? "–" : "$" + x.toLocaleString("en-US", { maximumFractionDigits: 0 });
const signClass = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";

// Minimal, safe Markdown: escape first, then headings, bold, lists, paragraphs.
function md(text) {
  return esc(text).split(/\n{2,}/).map((block) => {
    const b = block.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (/^#{1,6} /.test(b)) return "<p><strong>" + b.replace(/^#{1,6} /, "") + "</strong></p>";
    if (/^\s*[-*] /m.test(b)) return "<ul>" + b.split("\n").filter(Boolean).map((l) => "<li>" + l.replace(/^\s*[-*] /, "") + "</li>").join("") + "</ul>";
    return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";

// ---------------------------------------------------------------- charts (plain SVG)
const charts = [];
function niceTicks(lo, hi, n = 5) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function logTicks(lo, hi) {
  const out = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v >= lo && v <= hi) out.push(v); }
  return out;
}

function lineChart(el, { dates, series, log = false, fmt = (v) => v.toFixed(2), height = 300, zero = false }) {
  const draw = () => {
    const W = el.clientWidth || 600, H = height, m = { t: 10, r: 64, b: 24, l: 52 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = series.flatMap((s) => s.values.filter((v) => v != null));
    let lo = Math.min(...all), hi = Math.max(...all);
    if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    const ty = log ? Math.log10 : (v) => v;
    const pad = (ty(hi) - ty(lo)) * 0.05 || 1;
    const y0 = ty(lo) - pad, y1 = ty(hi) + pad;
    const X = (i) => m.l + (dates.length > 1 ? i / (dates.length - 1) : 0.5) * iw;
    const Y = (v) => m.t + (1 - (ty(v) - y0) / (y1 - y0)) * ih;
    const ticks = log ? logTicks(10 ** y0, 10 ** y1) : niceTicks(log ? 10 ** y0 : y0, y1);
    const years = []; let last = "";
    dates.forEach((d, i) => { const yr = d.slice(0, 4); if (yr !== last) { years.push([i, yr]); last = yr; } });
    const every = Math.ceil(years.length / Math.max(2, Math.floor(iw / 56)));
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map((x) => x.name).join(", "))}">`;
    for (const t of ticks) s += `<line class="gridline" x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`;
    if (zero) s += `<line class="baseline" x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    years.filter((_, k) => k % every === 0).forEach(([i, yr]) => { s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${yr}</text>`; });
    const ends = [];
    series.forEach((sr) => {
      let d = "", pen = false;
      sr.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
      s += `<path d="${d}" fill="none" stroke="var(${sr.color})" stroke-width="${sr.width || 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      const li = sr.values.length - 1;
      if (sr.label !== false && sr.values[li] != null) ends.push({ y: Y(sr.values[li]), text: fmt(sr.values[li]), color: sr.color });
    });
    ends.sort((a, b) => a.y - b.y).forEach((e, k, arr) => { if (k && e.y - arr[k - 1].y < 13) e.y = arr[k - 1].y + 13; });
    for (const e of ends) s += `<text x="${m.l + iw + 6}" y="${e.y + 4}" style="fill:var(--text-secondary)">${esc(e.text)}</text>`;
    s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" visibility="hidden"/>`;
    series.forEach((sr, k) => { s += `<circle class="dot${k}" r="4" fill="var(${sr.color})" stroke="var(--surface-1)" stroke-width="2" visibility="hidden"/>`; });
    s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
    el.innerHTML = s;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = svg.querySelector(".xh");
    const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); series.forEach((_, k) => svg.querySelector(".dot" + k).setAttribute("visibility", "hidden")); };
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("pointermove", (ev) => {
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(dates.length - 1, Math.round(((x - m.l) / iw) * (dates.length - 1))));
      xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility", "visible");
      let rows = "";
      series.forEach((sr, k) => {
        const v = sr.values[i], dot = svg.querySelector(".dot" + k);
        if (v == null) { dot.setAttribute("visibility", "hidden"); return; }
        dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(v)); dot.setAttribute("visibility", "visible");
        rows += `<div class="r" style="--c:var(${sr.color})"><span>${esc(sr.name)}</span><span class="num">${esc(fmt(v))}</span></div>`;
      });
      tip.innerHTML = `<div class="d">${esc(dates[i])}</div>${rows}`;
      tip.style.display = "block";
      const px = (X(i) / W) * r.width;
      tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth) + "px";
      tip.style.top = "8px";
    });
  };
  charts.push(draw); draw();
}

function barChart(el, { labels, series, fmt = (v) => pct(v, 0), height = 260 }) {
  const draw = () => {
    const W = el.clientWidth || 600, H = height, m = { t: 10, r: 8, b: 24, l: 48 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = series.flatMap((s) => s.values.filter((v) => v != null));
    const lo = Math.min(0, ...all), hi = Math.max(0, ...all);
    const Y = (v) => m.t + (1 - (v - lo) / (hi - lo || 1)) * ih;
    const slot = iw / labels.length, gap = 2, bw = Math.max(2, (slot * 0.72 - gap * (series.length - 1)) / series.length);
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Calendar-year returns">`;
    for (const t of niceTicks(lo, hi)) s += `<line class="gridline" x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`;
    const every = Math.ceil(labels.length / Math.max(2, Math.floor(iw / 44)));
    labels.forEach((lab, i) => {
      const x0 = m.l + i * slot + slot * 0.14;
      series.forEach((sr, k) => {
        const v = sr.values[i]; if (v == null) return;
        const y = Y(Math.max(v, 0)), h = Math.max(1, Math.abs(Y(v) - Y(0)));
        const x = x0 + k * (bw + gap), rr = Math.min(4, bw / 2, h);
        // rounded at the data end, square at the baseline
        const p = v >= 0
          ? `M${x} ${y + h}V${y + rr}Q${x} ${y} ${x + rr} ${y}H${x + bw - rr}Q${x + bw} ${y} ${x + bw} ${y + rr}V${y + h}Z`
          : `M${x} ${y}V${y + h - rr}Q${x} ${y + h} ${x + rr} ${y + h}H${x + bw - rr}Q${x + bw} ${y + h} ${x + bw} ${y + h - rr}V${y}Z`;
        s += `<path d="${p}" fill="var(${sr.color})" data-i="${i}"/>`;
      });
      if (i % every === 0) s += `<text x="${m.l + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
      s += `<rect x="${m.l + i * slot}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    });
    s += `<line class="baseline" x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}"/></svg><div class="tip"></div>`;
    el.innerHTML = s;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
    svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    svg.addEventListener("pointermove", (ev) => {
      const i = ev.target.dataset?.i; if (i == null) return;
      tip.innerHTML = `<div class="d">${esc(labels[i])}</div>` + series.map((sr) => `<div class="r" style="--c:var(${sr.color})"><span>${esc(sr.name)}</span><span class="num">${esc(sr.values[i] == null ? "–" : fmt(sr.values[i]))}</span></div>`).join("");
      tip.style.display = "block";
      const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
      tip.style.left = Math.min(x + 12, r.width - tip.offsetWidth) + "px"; tip.style.top = "8px";
    });
  };
  charts.push(draw); draw();
}
const legend = (series) => `<div class="legend">${series.map((s) => `<span style="--c:var(${s.color})">${esc(s.name)}</span>`).join("")}</div>`;

// ---------------------------------------------------------------- page
function tile(label, value, sub, cls = "") {
  return `<div class="card tile"><div class="label">${esc(label)}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
}

function agentPill(review) {
  if (!review) return `<span class="pill"><i></i>No paper day yet</span>`;
  const st = review.status || "";
  if (st === "ok") return `<span class="pill ok"><i></i>Agents reviewed today</span>`;
  if (st.startsWith("skipped")) return `<span class="pill off"><i></i>Agents off: ${esc(st.replace("skipped: ", ""))}</span>`;
  return `<span class="pill err"><i></i>Agents failed; algorithm traded alone</span>`;
}

function todaySection(paper, settings) {
  const latest = paper?.latest;
  if (!latest) return `<h2>Today</h2><div class="empty">The paper account has not traded yet. Run <code>aylintrade daily</code>.</div>`;
  const rv = latest.review || {};
  const decisions = rv.decisions || {}, guard = rv.guard || {};
  const maxW = Math.max(...Object.values(latest.target), 0.01);
  const rows = latest.facts.map((f) => {
    const m = f.market, t = latest.target[m] || 0, fin = latest.final[m] || 0, held = latest.held[m] || 0;
    const v = Object.values(f.trend_votes).flatMap((x) => [x.above_average, x.return_positive]);
    const d = decisions[m];
    const cutW = Math.max(0, t - fin);
    const gs = guard[m] === "clamped" ? ` <span class="muted small">(capped at ${pct(1 - settings.max_cut, 0)})</span>` : guard[m] === "review" ? ` <span class="muted small">(unreadable; kept)</span>` : "";
    return `<tr>
      <td><strong>${esc(f.label)}</strong><div class="muted small num">${esc(f.close.toLocaleString("en-US"))}</div></td>
      <td><span class="votes" title="${v.filter(Boolean).length} of 8 trend votes up">${v.map((x) => `<b class="${x ? "on" : ""}"></b>`).join("")}</span></td>
      <td class="n ${signClass(f.returns["1m"])}">${pct(f.returns["1m"], 1, true)}</td>
      <td class="n">${pct(f.volatility, 0)}</td>
      <td style="white-space:nowrap"><span class="bar" style="width:${(fin / maxW) * 90}px"></span>${cutW > 0.0005 ? `<span class="bar cut" style="width:${(cutW / maxW) * 90}px"></span>` : ""}<span class="num small">${pct(fin, 1)}</span></td>
      <td class="n">${pct(t, 1)}</td>
      <td class="n">${pct(held, 1)}</td>
      <td class="small">${d ? `<strong>${esc(d.rating)}</strong>${t > 0 ? ` · keep ${pct(fin / t, 0)}` : ""}${gs}<div class="muted">${esc(d.reason)}</div>` : `<span class="muted">${t > 0 ? "–" : "not held"}</span>`}</td>
    </tr>`;
  }).join("");
  const reports = rv.reports || {};
  const names = { market: "Market analyst", news: "News analyst", debate: "Bull vs bear debate", risk: "Risk manager" };
  const reportHtml = Object.entries(names).filter(([k]) => reports[k]).map(([k, n]) => `<details><summary>${n}</summary><div class="report">${md(reports[k])}</div></details>`).join("");
  const sources = (rv.sources || []).slice(0, 12).map((s) => `<li><a href="${esc(safeUrl(s.url))}" rel="noopener nofollow" target="_blank">${esc(s.title)}</a></li>`).join("");
  return `
  <h2>Today’s positions</h2>
  <p class="lede">Prices up to ${esc(latest.date)}. The algorithm sets a <em>target</em>; the agent committee may keep less of it (never more, and never below ${pct(1 - settings.max_cut, 0)}); the account trades only when the new weight is more than ${pct(0.03, 0)} away from what it holds. ${agentPill(rv)}</p>
  <div class="card scroll"><table>
    <thead><tr><th>Market</th><th>Trend votes</th><th class="n">1 month</th><th class="n">Volatility</th><th>After agents</th><th class="n">Algorithm</th><th class="n">Held</th><th>Committee</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="muted small">Trend votes: price above its 1, 3, 6 and 12-month average, and return over each horizon positive (filled = up). Weights are shares of the whole account; the rest is cash.</p>
  </div>
  ${rv.status === "ok" ? `<div class="card" style="margin-top:14px"><h3>Portfolio manager’s summary</h3><div class="report">${md(rv.summary)}</div>${reportHtml}${sources ? `<details><summary>News sources</summary><ul class="report">${sources}</ul></details>` : ""}<p class="muted small">Models: ${esc(rv.models?.analysts)} (analysts), ${esc(rv.models?.manager)} (manager).</p></div>` : ""}`;
}

function paperSection(paper) {
  if (!paper) return "";
  const n = paper.dates.length, eq = paper.equity, first = paper.capital, lastEq = eq[n - 1];
  const ret = lastEq / first - 1, spyRet = paper.spy[n - 1] / first - 1;
  const ag = paper.agents, eff = ag.effect.length ? ag.effect[ag.effect.length - 1] : null;
  let out = `<h2>Paper account</h2><p class="lede">Started ${esc(paper.start)} with ${money(first)} of simulated money. Trades at each day’s close, paying the same costs as the backtest.</p>
  <div class="grid tiles">
    ${tile("Account value", money(lastEq), `${pct(ret, 2, true)} since start`, signClass(ret))}
    ${tile("SPY over the same days", pct(spyRet, 2, true), "buy & hold, for comparison", signClass(spyRet))}
    ${tile("Agent decisions", String(ag.decisions), `${ag.settled} settled after 5 days, ${ag.cuts} were cuts`)}
    ${tile("What the agents’ cuts did", eff == null ? "–" : pct(eff, 2, true), eff == null ? "first results 5 trading days after a cut" : "of the account, versus no cuts", signClass(eff))}
  </div>`;
  if (n < 5) out += `<div class="empty" style="margin-top:14px">The equity chart appears after five trading days (${n} so far).</div>`;
  else {
    const s = [{ name: "Paper account", values: eq, color: "--s1" }, { name: "SPY, same start", values: paper.spy, color: "--s2" }];
    out += `<div class="card" style="margin-top:14px">${legend(s)}<div class="chart" id="paper-chart"></div></div>`;
    queueMicrotask(() => lineChart(document.getElementById("paper-chart"), { dates: paper.dates, series: s, fmt: money, height: 260 }));
  }
  if (paper.trades.length) out += `<details class="card" style="margin-top:14px"><summary>Recent trades</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Market</th><th>Side</th><th class="n">Value</th><th class="n">Price</th><th class="n">Cost</th></tr></thead><tbody>${paper.trades.map((t) => `<tr><td>${esc(t.date)}</td><td>${esc(t.market)}</td><td>${esc(t.side)}</td><td class="n">${money(Math.abs(t.value))}</td><td class="n">${esc(Number(t.price).toLocaleString("en-US", { maximumFractionDigits: 2 }))}</td><td class="n">$${Number(t.cost).toFixed(2)}</td></tr>`).join("")}</tbody></table></div></details>`;
  return out;
}

function backtestSection(study) {
  if (!study) return `<h2>Backtest</h2><div class="empty">No backtest yet. Run <code>aylintrade backtest</code>.</div>`;
  const names = Object.keys(study.stats), algo = names[0];
  const spyName = names.find((n) => n.includes("SPY"));
  const a = study.stats[algo], b = spyName ? study.stats[spyName] : null;
  const curveSeries = names.map((n, k) => ({ name: n, values: study.curves[n], color: SERIES[k], width: k === 0 ? 2.5 : 1.5 }));
  const ddSeries = [algo, spyName].filter(Boolean).map((n, k) => ({ name: n, values: study.drawdown[n], color: SERIES[k] }));
  const yrSeries = [algo, spyName].filter(Boolean).map((n, k) => ({ name: n, values: study.yearly[n], color: SERIES[k] }));
  queueMicrotask(() => {
    lineChart(document.getElementById("eq-chart"), { dates: study.curves.dates, series: curveSeries, log: true, fmt: (v) => "$" + (v >= 10 ? v.toFixed(0) : v.toFixed(2)), height: 340 });
    lineChart(document.getElementById("dd-chart"), { dates: study.curves.dates, series: ddSeries, fmt: (v) => pct(v, 0), height: 220, zero: true });
    barChart(document.getElementById("yr-chart"), { labels: study.yearly.years.map(String), series: yrSeries });
  });
  const statRows = names.map((n) => { const s = study.stats[n]; return `<tr class="${n === algo ? "hl" : ""}"><td>${esc(n)}</td><td class="n">${pct(s.cagr)}</td><td class="n">${pct(s.volatility)}</td><td class="n">${s.sharpe.toFixed(2)}</td><td class="n">${pct(s.max_drawdown, 0)}</td><td class="n">${s.turnover.toFixed(1)}x</td></tr>`; }).join("");
  const pm = study.per_market.map((r) => r.status !== "ok"
    ? `<tr><td>${esc(r.label)}</td><td colspan="6" class="muted small">Not tested: ${esc(r.reason)}</td></tr>`
    : `<tr><td>${esc(r.label)}</td><td class="n">${r.sharpe.toFixed(2)}</td><td class="n muted">${r.hold_sharpe.toFixed(2)}</td><td class="n">${pct(r.cagr)}</td><td class="n muted">${pct(r.hold_cagr)}</td><td class="n">${pct(r.max_drawdown, 0)}</td><td class="n muted">${pct(r.hold_max_drawdown, 0)}</td></tr>`).join("");
  const rb = study.robustness.map((r, i) => `<tr class="${i === 0 ? "hl" : ""}"><td>${esc(r.test)}</td><td>${esc(r.setting)}</td><td class="n">${r.sharpe.toFixed(2)}</td><td class="n">${pct(r.cagr)}</td><td class="n">${pct(r.max_drawdown, 0)}</td><td class="n muted">${r.spy_sharpe == null ? "–" : r.spy_sharpe.toFixed(2)}</td></tr>`).join("");
  return `
  <h2>Backtest, ${esc(study.start.slice(0, 4))} to today</h2>
  <p class="lede">The algorithm without the agents (a language model knows how history turned out, so the agents cannot be backtested honestly). All figures after trading costs. Settings: ${esc(study.settings)}.</p>
  <div class="grid tiles">
    ${tile("Return per unit of risk (Sharpe)", a.sharpe.toFixed(2), b ? `SPY ${b.sharpe.toFixed(2)}` : "")}
    ${tile("Worst drop", pct(a.max_drawdown, 0), b ? `SPY ${pct(b.max_drawdown, 0)}` : "", "neg")}
    ${tile("Average return per year", pct(a.cagr), b ? `SPY ${pct(b.cagr)}` : "")}
    ${tile("Volatility", pct(a.volatility), b ? `SPY ${pct(b.volatility)}` : "")}
  </div>
  ${b ? `<div class="note">The trade-off, plainly: per year the portfolio made ${pct(a.cagr)} against ${pct(b.cagr)} for holding the S&amp;P 500, with ${(a.volatility / b.volatility).toFixed(2)}x its swings and a worst loss of ${pct(a.max_drawdown, 0)} against ${pct(b.max_drawdown, 0)}. It aims to be easier to stick with, not to beat the index on raw return.</div>` : ""}
  <div class="card">
    <h3>Growth of $1</h3><p class="muted small" style="margin:0">Log scale, so equal steps are equal percentage changes.</p>
    ${legend(curveSeries)}<div class="chart" id="eq-chart"></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h3>Drop from the previous high</h3>${legend(ddSeries)}<div class="chart" id="dd-chart"></div></div>
    <div class="card"><h3>Calendar-year returns</h3>${legend(yrSeries)}<div class="chart" id="yr-chart"></div></div>
  </div>
  <div class="card scroll" style="margin-top:14px"><table><thead><tr><th>Portfolio</th><th class="n">Per year</th><th class="n">Volatility</th><th class="n">Sharpe</th><th class="n">Worst drop</th><th class="n">Turnover / yr</th></tr></thead><tbody>${statRows}</tbody></table></div>

  <h2>Each market on its own</h2>
  <p class="lede">The same rules applied to one market at a time, against holding it. The algorithm’s strength is in the mix, not in each market alone.</p>
  <div class="card scroll"><table><thead><tr><th>Market</th><th class="n">Sharpe</th><th class="n">Hold</th><th class="n">Per year</th><th class="n">Hold</th><th class="n">Worst drop</th><th class="n">Hold</th></tr></thead><tbody>${pm}</tbody></table></div>

  <h2>Stress tests</h2>
  <p class="lede">Does the result survive other settings, higher costs, fewer markets and other periods? Every alternative tried while designing the algorithm is listed here, not only the winner.</p>
  <div class="card scroll"><table><thead><tr><th>Test</th><th>Setting</th><th class="n">Sharpe</th><th class="n">Per year</th><th class="n">Worst drop</th><th class="n">SPY Sharpe</th></tr></thead><tbody>${rb}</tbody></table></div>`;
}

function render(data) {
  const study = data.study, paper = data.paper;
  document.getElementById("asof").textContent = study ? `Data to ${study.as_of} · updated ${study.created_utc.slice(0, 10)}` : "No data yet";
  document.getElementById("app").innerHTML = todaySection(paper, data.settings) + paperSection(paper) + backtestSection(study);
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach((d) => d()), 150); });
document.getElementById("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch {}
});
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch((e) => { document.getElementById("app").innerHTML = `<div class="empty">Could not load data.json (${esc(e.message)}). Run <code>aylintrade site</code>.</div>`; });
</script>
</body>
</html>
